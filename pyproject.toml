[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastfm-stats"
version = "0.2.1"
description = "Show Last.fm listening stats: all-time plays and plays by month."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ha-test = ["pytest-homeassistant-custom-component"]

[project.scripts]
lastfm-stats = "lastfm_stats.cli:main"

[tool.setuptools.packages.find]
include = ["lastfm_stats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
